name: Native Lab / Python and emulation contracts

on:
  push:
    paths:
      - 'scripts/native_lab.py'
      - 'scripts/ghidra/**'
      - 'scripts/differential_fuzz.py'
      - 'scripts/workbench.py'
      - 'tests/**'
      - '.github/workflows/native-lab.yml'
  pull_request:
    paths:
      - 'scripts/native_lab.py'
      - 'scripts/ghidra/**'
      - 'scripts/differential_fuzz.py'
      - 'scripts/workbench.py'
      - 'tests/**'
      - '.github/workflows/native-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unicorn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only the optional Unicorn test dependency
        run: python -m pip install 'unicorn>=2.1,<3'
      - name: Verify actual Unicorn emulation and Python CLI contracts
        run: python -m unittest discover -s tests -p 'test_native_lab.py' -v
      - name: Verify bounded differential fuzzing
        run: python -m unittest discover -s tests -p 'test_differential_fuzz.py' -v
